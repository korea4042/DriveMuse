name: Android build and contracts
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_ytApiKey: ${{ secrets.YT_API_KEY }}
      ORG_GRADLE_PROJECT_weatherApiKey: ${{ secrets.WEATHER_API_KEY }}
      ORG_GRADLE_PROJECT_geminiModel: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest ships the Android SDK; setup-android@v3 fails on the removed 'tools' package.
      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Optional stable debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No DEBUG_KEYSTORE_B64 secret; falling back to the runner's generated debug key."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > drivemuse.keystore
          echo "decoded bytes: $(stat -c%s drivemuse.keystore)"
          if keytool -list -keystore drivemuse.keystore -alias drivemuse -storepass drivemuse > /dev/null 2>&1; then
            keytool -list -v -keystore drivemuse.keystore -alias drivemuse -storepass drivemuse | grep 'SHA1:'
            echo "Using the stable debug keystore from secrets."
          else
            echo "::error::DEBUG_KEYSTORE_B64 did not decode into a readable keystore. Re-copy the single-line base64 value."
            keytool -list -keystore drivemuse.keystore -alias drivemuse -storepass drivemuse || true
            exit 1
          fi
      - name: Optional Firebase configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          config = os.environ.get("FIREBASE_CONFIG", "")
          if config:
              Path("app/google-services.json").write_text(config)
          PYTHON
      - run: python3 scripts/check_migration_sql.py
      - run: chmod +x gradlew && ./gradlew :core:domain:test :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DriveMuse-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests
            core/domain/build/reports/tests
