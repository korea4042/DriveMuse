name: Android build and contracts
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_ytApiKey: ${{ secrets.YT_API_KEY }}
      ORG_GRADLE_PROJECT_weatherApiKey: ${{ secrets.WEATHER_API_KEY }}
      ORG_GRADLE_PROJECT_geminiModel: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest ships the Android SDK; setup-android@v3 fails on the removed 'tools' package.
      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Optional Firebase configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          config = os.environ.get("FIREBASE_CONFIG", "")
          if config:
              Path("app/google-services.json").write_text(config)
          PYTHON
      - run: python3 scripts/check_migration_sql.py
      - name: Build and test
        run: |
          set -o pipefail
          chmod +x gradlew && ./gradlew :core:domain:test :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee /tmp/build.log
      # The migration test only proves the committed schema is consistent with itself. If an entity
      # changed without exporting, the build regenerates a different JSON and this catches it.
      # The publish-time guard is too late to stop a merge: it only runs on master. This one runs
      # on every push, so a branch that forgot to bump fails its own checks.
      - name: versionCode is ahead of the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | head -1 | grep -o '[0-9]*')
          if BODY=$(gh release view latest --json body --jq .body 2>/tmp/relerr); then
            PREV=$(printf '%s' "$BODY" | grep -o 'versionCode [0-9]*' | grep -o '[0-9]*' || true)
            if [ -z "$PREV" ]; then echo "Published release notes carry no versionCode." >&2; exit 1; fi
            if [ "$CODE" -le "$PREV" ]; then
              echo "versionCode $CODE is not greater than the published $PREV. Bump it in this branch." >&2
              exit 1
            fi
            echo "versionCode $CODE is ahead of the published $PREV."
          elif grep -qi "release not found\|not found" /tmp/relerr; then
            echo "No rolling release yet; nothing to compare against."
          else
            cat /tmp/relerr >&2; exit 1
          fi

      - name: Schema matches the committed JSON
        run: |
          if ! git diff --exit-code -- app/schemas; then
            echo "Exported Room schema differs from the committed JSON. Commit the regenerated file." >&2
            exit 1
          fi
          git status --porcelain app/schemas | grep . && { echo "Untracked schema file was generated; commit it." >&2; exit 1; } || true
      # Room writes app/schemas during the build. The JSON is reviewed and committed by hand, so
      # it is published as an artifact rather than pushed back into the branch.
      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas-${{ github.sha }}
          path: app/schemas/**/*.json
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DriveMuse-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Artifact downloads redirect to blob storage that some environments cannot reach, so the
      # same JSON is also staged on ci-logs where the plain contents API can read it. This is a
      # transport for review only: the reviewed file is committed to the working branch by hand.
      - name: Stage Room schemas for review
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST repos/$GITHUB_REPOSITORY/git/refs -f ref=refs/heads/ci-logs -f sha=$GITHUB_SHA || true
          for f in app/schemas/*/*.json; do
            [ -e "$f" ] || continue
            DEST="schemas/$GITHUB_SHA/$(basename "$f")"
            SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$DEST?ref=ci-logs" --jq .sha 2>/dev/null || true)
            if [ -n "$SHA" ]; then
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$DEST" -f message="schema export $GITHUB_SHA" -f branch=ci-logs -f content="$(base64 -w0 "$f")" -f sha="$SHA"
            else
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$DEST" -f message="schema export $GITHUB_SHA" -f branch=ci-logs -f content="$(base64 -w0 "$f")"
            fi
          done

      # Actions log downloads are not reachable from every environment, so a failure tail is
      # committed to the ci-logs branch where the plain contents API can read it.
      - name: Publish failure tail
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { grep -E "^e: |error:|FAILURE|What went wrong|Caused by" -A 2 /tmp/build.log || tail -n 120 /tmp/build.log; } | tail -n 150 > /tmp/tail.txt
          gh api --method POST repos/$GITHUB_REPOSITORY/git/refs -f ref=refs/heads/ci-logs -f sha=$GITHUB_SHA || true
          SHA=$(gh api repos/$GITHUB_REPOSITORY/contents/ci-failure.log?ref=ci-logs --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT repos/$GITHUB_REPOSITORY/contents/ci-failure.log -f message="ci failure $GITHUB_SHA" -f branch=ci-logs -f content="$(base64 -w0 /tmp/tail.txt)" -f sha="$SHA"
          else
            gh api --method PUT repos/$GITHUB_REPOSITORY/contents/ci-failure.log -f message="ci failure $GITHUB_SHA" -f branch=ci-logs -f content="$(base64 -w0 /tmp/tail.txt)"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DriveMuse-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests
            core/domain/build/reports/tests

  migration:
    name: Room migration upgrades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      # KVM is what makes the emulator usable on a hosted runner rather than glacial.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # One configuration is enough for a schema upgrade: it exercises Room and SQLite, not the UI.
      - name: Migration test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: chmod +x gradlew && ./gradlew :app:connectedDebugAndroidTest

  publish:
    name: Publish rolling release
    # FIX-E: the release used to ride inside the build job, so a failed or still-running migration
    # could not stop it. Both gates must pass before anything reaches the stable APK URL.
    needs: [build, migration]
    if: success() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The artifact from the build job, so the published APK is the one that was tested.
      - uses: actions/download-artifact@v4
        with:
          name: DriveMuse-debug-${{ github.sha }}
          path: apk
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv apk/*.apk DriveMuse.apk
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | head -1 | grep -o '[0-9]*')
          # Publishing the same versionCode twice ships a build the phone cannot tell from the one
          # it already has, and the updater compares this number. Every failure below stops the
          # publish: an unreadable release is not the same as no release, and treating a lookup
          # error as "nothing published yet" is how the check gets skipped exactly when it matters.
          if BODY=$(gh release view latest --json body --jq .body 2>/tmp/relerr); then
            PREV=$(printf '%s' "$BODY" | grep -o 'versionCode [0-9]*' | grep -o '[0-9]*' || true)
            if [ -z "$PREV" ]; then
              echo "The published release notes carry no versionCode, so the guard cannot run:" >&2
              printf '%s\n' "$BODY" >&2
              exit 1
            fi
            if [ "$CODE" -le "$PREV" ]; then
              echo "versionCode $CODE is not greater than the published $PREV. Bump it before merging." >&2
              exit 1
            fi
            # Keep the build being replaced, so an upgrade test always has a baseline. The rolling
            # asset is overwritten in place and the 81d5510 build was already lost this way.
            gh release download latest --pattern DriveMuse.apk --output previous.apk --clobber
            if gh release view "v$PREV" >/dev/null 2>&1; then
              gh release upload "v$PREV" previous.apk --clobber
            else
              gh release create "v$PREV" previous.apk --title "DriveMuse versionCode $PREV" --notes "Archived before publishing versionCode $CODE"
            fi
          elif grep -qi "release not found\|not found" /tmp/relerr; then
            echo "No rolling release yet; this is the first publish."
          else
            echo "Could not read the current release, so the version guard could not run:" >&2
            cat /tmp/relerr >&2
            exit 1
          fi
          # The app compares versionCode, because two builds can share a versionName.
          NOTES="versionCode $CODE · commit $GITHUB_SHA"
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "DriveMuse $VERSION" --notes "$NOTES" --prerelease=false --latest
          else
            gh release create latest --title "DriveMuse $VERSION" --notes "$NOTES" --latest
          fi
          gh release upload latest DriveMuse.apk --clobber
