name: Android build and contracts
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_ytApiKey: ${{ secrets.YT_API_KEY }}
      ORG_GRADLE_PROJECT_weatherApiKey: ${{ secrets.WEATHER_API_KEY }}
      ORG_GRADLE_PROJECT_geminiModel: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest ships the Android SDK; setup-android@v3 fails on the removed 'tools' package.
      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Optional Firebase configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          config = os.environ.get("FIREBASE_CONFIG", "")
          if config:
              Path("app/google-services.json").write_text(config)
          PYTHON
      - run: python3 scripts/check_migration_sql.py
      - name: Build and test
        run: |
          set -o pipefail
          chmod +x gradlew && ./gradlew :core:domain:test :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee /tmp/build.log
      # Room writes app/schemas during the build. The JSON is reviewed and committed by hand, so
      # it is published as an artifact rather than pushed back into the branch.
      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas-${{ github.sha }}
          path: app/schemas/**/*.json
          if-no-files-found: warn

      # Actions log downloads are not reachable from every environment, so a failure tail is
      # committed to the ci-logs branch where the plain contents API can read it.
      - name: Publish failure tail
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { grep -E "^e: |error:|FAILURE|What went wrong|Caused by" -A 2 /tmp/build.log || tail -n 120 /tmp/build.log; } | tail -n 150 > /tmp/tail.txt
          gh api --method POST repos/$GITHUB_REPOSITORY/git/refs -f ref=refs/heads/ci-logs -f sha=$GITHUB_SHA || true
          SHA=$(gh api repos/$GITHUB_REPOSITORY/contents/ci-failure.log?ref=ci-logs --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT repos/$GITHUB_REPOSITORY/contents/ci-failure.log -f message="ci failure $GITHUB_SHA" -f branch=ci-logs -f content="$(base64 -w0 /tmp/tail.txt)" -f sha="$SHA"
          else
            gh api --method PUT repos/$GITHUB_REPOSITORY/contents/ci-failure.log -f message="ci failure $GITHUB_SHA" -f branch=ci-logs -f content="$(base64 -w0 /tmp/tail.txt)"
          fi
      # A rolling release so the phone can install straight from a stable URL instead of
      # unzipping a build artifact: /releases/latest/download/DriveMuse.apk
      - name: Publish rolling release
        if: success() && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          cp app/build/outputs/apk/debug/app-debug.apk DriveMuse.apk
          NOTES="버전 $VERSION · 커밋 ${GITHUB_SHA:0:7} · $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') KST"
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "DriveMuse $VERSION" --notes "$NOTES" --prerelease=false --latest
          else
            gh release create latest --title "DriveMuse $VERSION" --notes "$NOTES" --latest
          fi
          gh release upload latest DriveMuse.apk --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DriveMuse-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests
            core/domain/build/reports/tests
